<!--Projects Page-->
<!--Grid layout of projects-->
<!--Add filters for certain projects-->

<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>JackyK Portfolio</title>
        <link rel="icon" href="./Assets/General/favicon.ico" type="image/x-icon"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
        <link rel="stylesheet" href="./style.css">
        <script defer src="./script.js"></script>

        <style type="text/css">
            @media screen and (max-width: 1200px){
                div.projectCardFooterTagContainer{font-size: 1vw;}
                div.projectCardFooterDate{font-size: 1.2vw;}
            }
            @media screen and (max-width: 992px){
                div.bannerDiv_Projects{padding: 20px 10vw 30px 10vw;}
                text.bannerTitle{font-size: 32px;}
                text.bannerFiller{font-size: 16px;}
                button.tableButton{font-size: 16px;}
                text.projectCardBanner{font-size: 16px;}
                div.projectCardFooterTagContainer{font-size: 1vw;}
                div.projectCardFooterDate{font-size: 1.5vw;}
            }
            @media screen and (max-width: 768px){
                div.projectCardFooterTagContainer{font-size: 1.5vw; padding: 5px 10px;}
                div.projectCardFooterDate{font-size: 2vw; padding: 0px 10px;}
            }
            @media screen and (max-width: 576px){
                div.bannerDiv_Projects{padding: 20px 30px 30px 30px;}
                div.tableButtonContainer{white-space: wrap;}
                text.projectCardBanner{font-size: 14px;}
                div.projectTable{margin: 0px 10px;}
                div.projectCardFooterTagContainer{font-size: 2vw;}
                div.projectCardFooterDate{font-size: 2.5vw;}
                div.footerDiv{padding: 20px 40px;}
            }
        </style>
    </head>
    <body onload="scrollPage(0), createTable('all'), resetButtons(1)">
        <!--Nav bar-->
        <nav class="navbar navbar-expand-lg fixed-top">

            <div class="container-fluid" style="align-items: center;">

                <text>Jacky Kam Portfolio</text>
                <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
                    <span class="navbarBurger"><img style="width: 36px;" src="./Assets/General/NavIcons/menuDrop.png"></span>
                </button>

                <div class="offcanvas offcanvas-end text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar" aria-labelledby="offcanvasDarkNavbarLabel">

                    <div class="offcanvas-header">
                        <h5 class="offcanvas-title navbarBrand" id="offcanvasDarkNavbarLabel">Navigation</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                    </div>

                    <div class="offcanvas-body">

                        <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
                            <li class="nav-item">
                                <a class="nav-link" href="./index.html">Home</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link activeNav" href="./projects.html">Projects</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="./contact.html">Contact</a>
                            </li>
                        </ul>

                    </div>

                </div>

            </div>

        </nav>

        <!--Have a banner, then tags to sort projects-->
        <span class="topSpan_Projects">
            <img src="./Assets/General/Projects/Banner.png" style="width: 100%;">
        </span>
        <div class="row bannerDiv_Projects">
            <div class="col-md-10">
                <text class="bannerTitle">Projects</text><br>
                <text class="bannerFiller">Some of the projects I've worked on. Highlight for a brief description, or click to learn more!</text><br>
            </div>
            <div class="col-md-2" style="text-align: center; align-content: center;">
                <center>
                    <img class="projectIcon" onclick="window.open('./Assets/General/Projects/JackyKam_Portfolio2024.pdf')"><br>
                    PDF portfolio!
                </center>
            </div>
            <div class="tableButtonContainer">
                <button class="tableButton-active" id="tableButton1" onclick="createTable('all'), resetButtons(1)">All Projects</button>
                <button class="tableButton" id="tableButton2" onclick="createTable('build'), resetButtons(2)">Builds</button>
                <button class="tableButton" id="tableButton3" onclick="createTable('coding'), resetButtons(3)">Coding</button>
                <button class="tableButton" id="tableButton4" onclick="createTable('design'), resetButtons(4)">Designs</button>
            </div>
        </div>

        <span class="mainSpan_Projects">
            <div class="row projectTable" id="tableContainer"></div>
        </span>
        <div class="footerDiv">
            Copyright &copy 2024 Jacky Kam<br>
            Designed and developed with a 12-pack of Red Bull
        </div>
    </body>
</html>
